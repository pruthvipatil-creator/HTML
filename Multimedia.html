<!DOCTYPE html>
<html>
    <head>
        <title>Multimedia Web Pages</title>
    </head>
    <body>
        <h1 align="center">MULTIMEDIA WEB PAGES</h1>
        <hr>
        <!-- Image -->
         <h2>1. Image</h2>
         <img src="cllege.jpg" alt="College Image" width="500" height="300">
         <br><br>

         <!-- GIF -->
          <h2>2.Animated Gif</h2>
          <img src="welcome.gif" alt="Welcome GIF" width="300" height="200">
          <br><br>

          <!-- Audio -->
            <h2>3. Audio</h2>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <br><br>
            <!-- Video -->
            <h2>4. Video</h2>
            <video width="500" height="300" controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.    
            </video>
            <br><br>
            <!-- YouTube Video -->
            <h2>5. YouTube Video</h2>
            <iframe width="500" height="300" src="https://www.youtube.com/embed/VIDEO_ID" title="Youtube Video" allowfullscreen>
            </iframe>
            <hr>
            <h3 align="center">Thank You</h3>
        </body>
</html>
