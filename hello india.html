
<!DOCTYPE html>
<html>
<head>
    <title>Hello India!</title>

    <style>
        .container {
            position: relative;
            width: 800px;
            height: 900px;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay h1 {
            font-size: 48px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="C:\Users\LENOVO\OneDrive\Desktop\HTML FILE\india-map.jpg" alt="India Map">

        <div class="overlay">
            <h1>Hello India!</h1>
        </div>

    </div>

</body>
</html>
