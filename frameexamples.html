
<!DOCTYPE html>
<html>
<head>
    <title>Frames Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .top {
            height: 30vh;
            text-align: center;
            padding-top: 10px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            height: 70vh;
        }

        .left {
            width: 30%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .right {
            width: 70%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="top">
        <h1>Welcome to the top frame!</h1>
    </div>

    <div class="container">
        <div class="left">
            <h1>Welcome to the left frame!</h1>
        </div>

        <div class="right">
            <h1>Welcome to the right frame!</h1>
        </div>
    </div>

</body>
</html>
