
<!DOCTYPE html>
<html>
<head>
    <title>Three Frames in One Row</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .frame1 {
            width: 33.33%;
            background-color: #FFC300;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame2 {
            width: 33.33%;
            background-color: #00FF00;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame3 {
            width: 33.34%;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="frame1">
            <h1>Frame First</h1>
        </div>

        <div class="frame2">
            <h1>Frame Second</h1>
        </div>

        <div class="frame3">
            <h1>Frame Third</h1>
        </div>

    </div>

</body>
</html>
